<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas AI Chatbot</title>
    <!-- Favicon -->
    <link rel="icon" href="public/nebula.jpg" type="image/jpeg">
    <!-- Tailwind CSS for styling via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS for additional styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- Chat Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl flex flex-col h-[90vh] md:h-[80vh] overflow-hidden">

        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 flex items-center justify-center shadow-md z-10">
            <h1 class="text-xl font-semibold">Atlas AI Assistant</h1>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col space-y-4 bg-gray-50">
            <!-- Messages will be injected here by JavaScript -->
        </div>

        <!-- Loading Indicator (Hidden by default) -->
        <div id="loading" class="hidden p-4 flex space-x-1 items-center text-gray-500 bg-gray-50">
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-200">
            <form id="chat-form" class="flex items-center space-x-2">
                <input type="text" id="chat-input" placeholder="Type your message..."
                    class="flex-1 p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    required>
                <button type="submit"
                    class="bg-blue-600 text-white p-3 rounded-full hover:bg-blue-700 transition duration-300 flex items-center justify-center w-12 h-12">
                    <!-- Send Icon (SVG) -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                        <path
                            d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
